[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barunlm"
version = "1.0.0"
description = "Native PyTorch implementation for BarunLM-35M"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Harshal Singh"}]
keywords = ["language-model", "pytorch", "small-language-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.26",
  "safetensors>=0.4.5",
  "tokenizers>=0.20,<1",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/harrrshall/barunlm-35m"
Model = "https://huggingface.co/harrrshall/BarunLM-35M"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
